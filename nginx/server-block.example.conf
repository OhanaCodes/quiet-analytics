# Add these two lines inside the server { } block of the site you want to count.
# Nothing else in your configuration needs to change.

    access_log /var/log/nginx/quiet.access.log quiet_private;

    # nginx error logs cannot use a custom format, so they would record full client addresses.
    # Send this site's error output to /dev/null; HTTP status counts remain in the access log.
    # Drop this line if you would rather keep error diagnostics than keep the promise.
    error_log /dev/null crit;
