# Quiet Analytics — http-context maps and log format.
# Install at /etc/nginx/conf.d/00-quiet-analytics.conf
#
# Nothing here is written to disk in identifying form. The visitor's address is masked by nginx
# itself, before serialization: there is no moment at which the full address exists in a log file.
# No query strings, no user agents, no referrer paths, no authenticated usernames.

# ---------------------------------------------------------------------------------------------
# 1. Address masking. IPv4 to /24, IPv6 to /48. Anything unrecognised becomes 0.0.0.0.
#    Uses the real peer address, never a caller-supplied forwarding header.
#    (Behind a trusted proxy, set up real_ip_module so $remote_addr is already the true peer.)
# ---------------------------------------------------------------------------------------------
map $remote_addr $qa_network {
    default 0.0.0.0;
    ~^(?<qa_v4>\d+\.\d+\.\d+)\.\d+$ $qa_v4.0;
    ~*^::ffff:(?<qa_mapped>\d+\.\d+\.\d+)\.\d+$ $qa_mapped.0;
    # Expanded prefixes, then compressed prefixes with one or two leading zero groups.
    "~*^(?<qa_a>[0-9a-f]{1,4}):(?<qa_b>[0-9a-f]{1,4}):(?<qa_c>[0-9a-f]{1,4}):" $qa_a:$qa_b:$qa_c::;
    "~*^::(?<qa_z1>[0-9a-f]{1,4}):(?<qa_z2>[0-9a-f]{1,4})(?::[0-9a-f]{1,4}){5}$" 0:$qa_z1:$qa_z2::;
    "~*^::(?<qa_z3>[0-9a-f]{1,4})(?::[0-9a-f]{1,4}){5}$" 0:0:$qa_z3::;
    "~*^(?<qa_o1>[0-9a-f]{1,4})::(?<qa_o2>[0-9a-f]{1,4})(?::[0-9a-f]{1,4}){5}$" $qa_o1:0:$qa_o2::;
    "~*^(?<qa_two1>[0-9a-f]{1,4}):(?<qa_two2>[0-9a-f]{1,4})::" $qa_two1:$qa_two2:0::;
    "~*^(?<qa_one>[0-9a-f]{1,4})::" $qa_one:0:0::;
    ~^:: 0:0:0::;
}

# ---------------------------------------------------------------------------------------------
# 2. Referrer: the sending domain only. Never its path or query. IP-literal referrers are dropped.
# ---------------------------------------------------------------------------------------------
map $http_referer $qa_referrer {
    default "-";
    ~*^https?://[0-9.]+(?::[0-9]+)?(?:/|$) "-";
    "~*^https?://(?<qa_ref_domain>[a-z0-9][a-z0-9.-]{0,251}\.[a-z]{2,63})(?::[0-9]+)?(?:/|$)" https://$qa_ref_domain/;
}

# ---------------------------------------------------------------------------------------------
# 3. EDIT THIS BLOCK. The pages you want counted, by name. Anything not listed becomes /other,
#    so the log cannot accumulate a long tail of accidental or user-bearing URLs.
#    Group whole directories with a regex, as with /assets/ below.
# ---------------------------------------------------------------------------------------------
map $uri $qa_target {
    default /other;
    / /;
    /index.html /;
    /about.html /about.html;
    /contact.html /contact.html;
    ~^/assets/ /assets/;
}

# ---------------------------------------------------------------------------------------------
# 4. The log format. Shaped like COMBINED so ordinary log tools read it, but every field that
#    could identify a person has already been replaced above.
# ---------------------------------------------------------------------------------------------
log_format quiet_private '$qa_network - - [$time_local] "$request_method $qa_target $server_protocol" '
                         '$status $body_bytes_sent "$qa_referrer" "-"';
